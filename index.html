<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابزار ساخت زنجیره ایموجی در ایتا</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF7634 0%, #FFB088 100%);
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(255, 118, 52, 0.25);
      padding: 40px 30px;
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      button { transition: none; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #333;
      font-size: 1.6em;
      margin: 0 0 10px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .subtitle {
      color: #888;
      font-size: 0.95em;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      padding: 14px 16px;
      font-size: 1.05em;
      border-radius: 14px;
      border: 2px solid #e5e7eb;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      background: #fafafa;
      font-family: inherit;
      color: #333;
      min-width: 0;
      width: 100%;
    }

    input:focus {
      border-color: #FF7634;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 118, 52, 0.15);
    }

    #emoji {
      flex: 2 1 180px;
      text-align: center;
    }

    #count {
      flex: 1 1 100px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1em;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #FF7634 0%, #FF9A5C 100%);
      color: white;
      cursor: pointer;
      transition: box-shadow 0.25s ease, background 0.25s ease;
      font-family: inherit;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(255, 118, 52, 0.4);
      outline: none;
    }

    button:hover {
      box-shadow: 0 10px 25px rgba(255, 118, 52, 0.55);
    }

    button:focus-visible {
      box-shadow: 0 0 0 4px rgba(255, 118, 52, 0.35),
                  0 6px 20px rgba(255, 118, 52, 0.4);
    }

    button:active {
      box-shadow: 0 4px 12px rgba(255, 118, 52, 0.4);
    }

    textarea {
      display: block;
      width: 100%;
      height: 150px;
      font-size: 1.1em;
      direction: ltr;
      border-radius: 14px;
      border: 2px solid #e5e7eb;
      padding: 14px;
      background: #fafafa;
      resize: vertical;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      font-family: inherit;
      text-align: center;
      color: #333;
      line-height: 1.6;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    textarea:focus {
      border-color: #FF7634;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 118, 52, 0.15);
    }

    .hint {
      font-size: 0.85em;
      color: #999;
      margin-top: 10px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .card { padding: 28px 18px; border-radius: 18px; }
      h1 { font-size: 1.35em; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ابزار ساخت زنجیره ایموجی در ایتا</h1>
    <p class="subtitle">ایموجی یا متن مورد نظرت رو وارد کن و تعداد تکرارش رو مشخص کن</p>

    <div class="input-group">
      <input type="text" id="emoji" placeholder="مثلاً: 😂 یا سلام">
      <input type="number" id="count" placeholder="تعداد" min="1">
    </div>

    <button onclick="generate()">ساختن زنجیره</button>

    <textarea id="output" readonly placeholder="نتیجه اینجا نمایش داده می‌شود..."></textarea>

    <p class="hint">کافیه نتیجه رو کپی کنی و توی ایتا بفرستی</p>
  </div>

  <script>
    function generate() {
      const emoji = document.getElementById("emoji").value.trim();
      const count = parseInt(document.getElementById("count").value);
      const zwj = '\u200D';
      let result = "";

      if (!emoji) {
        alert("لطفاً یک متن یا ایموجی وارد کن!");
        return;
      }

      if (isNaN(count) || count < 1) {
        alert("لطفاً یک عدد معتبر برای تعداد تکرار وارد کن!");
        return;
      }

      for (let i = 0; i < count; i++) {
        result += emoji + zwj;
      }

      result = result.slice(0, -1);
      document.getElementById("output").value = result;
    }
  </script>
</body>
</html>
